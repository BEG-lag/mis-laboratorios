<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">mis-laboratorios</title>
  <desc id="d">Banner animado: archivos PDF de resultados entran a una ventana del navegador y se convierten en una gráfica en el tiempo con la franja del rango del laboratorio. Nada sale del dispositivo.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-style: italic; }
    .sans { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 7s cubic-bezier(.3,.7,.2,1) infinite; }
    .pt { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 7s ease-out infinite; }
    .band { animation: band 7s ease-in-out infinite; }
    .doc { opacity: 0; animation: drift 7s ease-in-out infinite; }
    .tip { opacity: 0; animation: tip 7s ease-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes draw { 0%, 18% { stroke-dashoffset: 520; } 55%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 520; } }
    @keyframes pop { 0%, 20% { opacity: 0; transform: scale(.2); } 30%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes band { 0%, 10% { opacity: 0; } 22%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes drift { 0% { opacity: 0; transform: translate(150px, 0); } 6% { opacity: 1; } 20% { opacity: 1; transform: translate(0, 0); } 28%, 100% { opacity: 0; transform: translate(-40px, 0); } }
    @keyframes tip { 0%, 58% { opacity: 0; transform: translateY(6px); } 66%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .pt, .band, .doc, .tip, .blink, .pulse { animation: none; }
      .line { stroke-dashoffset: 0; }
      .pt, .band, .tip { opacity: 1; }
      .doc { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eceee6" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <g id="pdf">
      <path d="M0 0h34l12 12v44a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Z" fill="#191d27" stroke="#eceee6" stroke-opacity=".5"/>
      <path d="M34 0v12h12" fill="none" stroke="#eceee6" stroke-opacity=".5"/>
      <text x="23" y="42" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7fd8ff">PDF</text>
    </g>
  </defs>

  <rect width="1280" height="360" fill="#0a0c10"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect y="220" width="1280" height="140" fill="url(#fade)"/>

  <!-- Texto -->
  <text x="64" y="86" class="mono" font-size="15" letter-spacing="2.4" fill="#cfff45">PDF · OCR OPCIONAL · 100% LOCAL</text>
  <text x="62" y="158" class="mono" font-size="60" font-weight="700" letter-spacing="-2.5" fill="#eceee6">mis<tspan fill="#cfff45">-laboratorios</tspan><tspan class="blink" fill="#cfff45">_</tspan></text>
  <text x="64" y="210" class="serif" font-size="36" fill="#cfff45">tus análisis, en una línea de tiempo</text>
  <text x="64" y="256" class="sans" font-size="17" fill="#eceee6" fill-opacity=".82">Cada indicador contra el rango de su laboratorio · no interpreta ni diagnostica</text>

  <g transform="translate(64 290)">
    <rect width="150" height="32" rx="16" fill="none" stroke="#eceee6" stroke-opacity=".28"/>
    <circle cx="20" cy="16" r="4" fill="#cfff45" class="pulse"/>
    <text x="34" y="21" class="mono" font-size="13" fill="#eceee6">100% local</text>
    <rect x="162" width="126" height="32" rx="16" fill="none" stroke="#eceee6" stroke-opacity=".28"/>
    <circle cx="182" cy="16" r="4" fill="#cfff45"/>
    <text x="196" y="21" class="mono" font-size="13" fill="#eceee6">0 envíos</text>
    <rect x="300" width="190" height="32" rx="16" fill="none" stroke="#eceee6" stroke-opacity=".28"/>
    <circle cx="320" cy="16" r="4" fill="#ffb648"/>
    <text x="334" y="21" class="mono" font-size="13" fill="#eceee6">sin diagnóstico</text>
  </g>

  <!-- Ventana del navegador -->
  <g transform="translate(800 52)">
    <rect width="420" height="266" rx="16" fill="#11141b" stroke="#eceee6" stroke-opacity=".18"/>
    <path d="M0 16a16 16 0 0 1 16-16h388a16 16 0 0 1 16 16v20H0Z" fill="#191d27"/>
    <circle cx="20" cy="18" r="5" fill="#ff5d47"/>
    <circle cx="38" cy="18" r="5" fill="#ffb648"/>
    <circle cx="56" cy="18" r="5" fill="#cfff45"/>
    <g transform="translate(330 8)">
      <rect x="0" y="9" width="16" height="11" rx="2" fill="none" stroke="#cfff45" stroke-width="1.8"/>
      <path d="M3.5 9V6.5a4.5 4.5 0 0 1 9 0V9" fill="none" stroke="#cfff45" stroke-width="1.8"/>
      <text x="24" y="19" class="mono" font-size="11" fill="#969dab">local</text>
    </g>
    <text x="24" y="66" class="mono" font-size="13" fill="#969dab">glucosa · mg/dL</text>
    <text x="396" y="66" text-anchor="end" class="serif" font-size="18" fill="#eceee6" fill-opacity=".8">2019-2026</text>

    <!-- Franja del rango de cada laboratorio -->
    <g class="band">
      <rect x="24" y="118" width="130" height="92" fill="#cfff45" fill-opacity=".1"/>
      <rect x="154" y="104" width="104" height="96" fill="#cfff45" fill-opacity=".1"/>
      <rect x="258" y="122" width="138" height="88" fill="#cfff45" fill-opacity=".1"/>
      <path d="M24 118H154M154 104H258M258 122H396" fill="none" stroke="#cfff45" stroke-opacity=".55" stroke-dasharray="4 4"/>
    </g>
    <line x1="24" x2="396" y1="226" y2="226" stroke="#eceee6" stroke-opacity=".25"/>
    <path class="line" d="M44 176 L98 164 L152 150 L206 136 L250 96 L314 116 L372 146" fill="none" stroke="#eceee6" stroke-opacity=".75" stroke-width="2" stroke-linejoin="round"/>
    <circle class="pt" cx="44" cy="176" r="5.5" fill="#cfff45" stroke="#11141b" stroke-width="2" style="animation-delay:.1s"/>
    <circle class="pt" cx="98" cy="164" r="5.5" fill="#cfff45" stroke="#11141b" stroke-width="2" style="animation-delay:.25s"/>
    <circle class="pt" cx="152" cy="150" r="5.5" fill="#cfff45" stroke="#11141b" stroke-width="2" style="animation-delay:.4s"/>
    <circle class="pt" cx="206" cy="136" r="5.5" fill="#cfff45" stroke="#11141b" stroke-width="2" style="animation-delay:.55s"/>
    <g class="pt" style="animation-delay:.7s">
      <circle cx="250" cy="96" r="5.5" fill="#ff5d47" stroke="#11141b" stroke-width="2"/>
      <path d="M250 81 L255 87 L245 87 Z" fill="#ff5d47"/>
    </g>
    <g class="pt" style="animation-delay:.85s">
      <circle cx="314" cy="116" r="5.5" fill="#ff5d47" stroke="#11141b" stroke-width="2"/>
      <path d="M314 101 L319 107 L309 107 Z" fill="#ff5d47"/>
    </g>
    <circle class="pt" cx="372" cy="146" r="5.5" fill="#cfff45" stroke="#11141b" stroke-width="2" style="animation-delay:1s"/>
    <g transform="translate(150 234)"><g class="tip">
      <rect width="210" height="24" rx="12" fill="#eceee6"/>
      <text x="105" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0a0c10">108 · rango del lab 74-106</text>
    </g></g>
  </g>

  <!-- PDF que entran al navegador -->
  <g transform="translate(1110 118)"><g class="doc" style="animation-delay:0s"><use href="#pdf"/></g></g>
  <g transform="translate(1150 188)"><g class="doc" style="animation-delay:.6s"><use href="#pdf"/></g></g>
  <g transform="translate(1100 248)"><g class="doc" style="animation-delay:1.2s"><use href="#pdf"/></g></g>
</svg>
